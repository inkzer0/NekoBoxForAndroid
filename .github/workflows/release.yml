name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag for this exact commit (v<version>)"
        required: false
      validate:
        description: "Verification only: run JVM tests and check unsigned APKs; never publish"
        type: boolean
        default: false
      publish:
        description: "Enter y to skip drafting the GitHub release"
        required: false
      play:
        description: "Enter y to skip the Play bundle"
        required: false
permissions:
  contents: read

jobs:
  verify-tag:
    if: ${{ !inputs.validate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify source commit and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash buildScript/release/verify-tag.sh "$RELEASE_TAG"

  libcore:
    needs: verify-tag
    if: ${{ !cancelled() && (needs.verify-tag.result == 'success' || (inputs.validate && needs.verify-tag.result == 'skipped')) }}
    uses: ./.github/workflows/build-libcore.yml

  validate:
    name: Test JVM and check unsigned APK alignment
    if: ${{ inputs.validate }}
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-libcore
          path: app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: |
          source buildScript/init/android_toolchain.properties
          sdkmanager 'platforms;android-35' "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Run JVM regressions and verify unsigned packaging
        env:
          BUILD_PLUGIN: none
        run: |
          ./run init action gradle
          ./gradlew -I app/src/test/phase2.init.gradle :app:testOssDebugUnitTest :app:assembleOssRelease
          source buildScript/init/android_toolchain.properties
          packages=(app/build/outputs/apk/oss/release/*.apk)
          python3 buildScript/release/check-elf.py "${packages[@]}"
          for package in "${packages[@]}"; do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -c -P 16 -v 4 "$package"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JVM-test-results
          path: app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-validation-apks
          path: app/build/outputs/apk/oss/release/*.apk
          if-no-files-found: error

  build:
    name: Build and verify signed OSS APKs
    if: ${{ !inputs.validate }}
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-libcore
          path: app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: |
          source buildScript/init/android_toolchain.properties
          sdkmanager 'platforms;android-35' "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Build, sign and verify final APKs
        env:
          BUILD_PLUGIN: none
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          source buildScript/release/signing-env.sh
          ./run init action gradle
          ./gradlew app:assembleOssRelease
          bash buildScript/release/verify-packages.sh app/build/outputs/apk/oss/release/*.apk
          mkdir release-artifacts
          cp app/build/outputs/apk/oss/release/*.apk release-artifacts/
          git rev-parse HEAD > release-artifacts/source-commit.txt
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: release-artifacts/
          if-no-files-found: error

  publish:
    name: Draft tag-matched GitHub release
    if: ${{ !inputs.validate && inputs.publish != 'y' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Verify release provenance and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bash buildScript/release/verify-tag.sh "$RELEASE_TAG"
          source_commit=$(git rev-parse HEAD)
          test "$(cat artifacts/source-commit.txt)" = "$source_commit"
          (cd artifacts && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" artifacts/*.apk artifacts/SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TAG" --notes "Built from $source_commit."

  play:
    name: Build and verify signed Play bundle
    if: ${{ !inputs.validate && inputs.play != 'y' }}
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-libcore
          path: app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: |
          source buildScript/init/android_toolchain.properties
          sdkmanager 'platforms;android-35' "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Build, sign and verify final AAB
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          source buildScript/release/signing-env.sh
          export BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
          curl -fL --retry 3 -o "$BUNDLETOOL_JAR" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          printf '%s  %s\n' '378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584' "$BUNDLETOOL_JAR" | sha256sum --check
          ./run init action gradle
          ./gradlew app:bundlePlayRelease
          bash buildScript/release/verify-packages.sh app/build/outputs/bundle/playRelease/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: AAB
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
