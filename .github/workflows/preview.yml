name: Preview Build
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  libcore:
    uses: ./.github/workflows/build-libcore.yml

  build:
    name: Build and verify signed preview APKs
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-libcore
          path: app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: |
          source buildScript/init/android_toolchain.properties
          sdkmanager 'platforms;android-35' "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Build, sign and verify final APKs
        env:
          BUILD_PLUGIN: none
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          source buildScript/release/signing-env.sh
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          bash buildScript/release/verify-packages.sh app/build/outputs/apk/preview/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/preview/release/*.apk
          if-no-files-found: error
